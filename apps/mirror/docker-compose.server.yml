# Servicio de espejo en SRPY186. Vive en /home/santarosa/stack/renew-mirror/
# junto a `.env` (600), `secrets/renew-mirror-sa.json` (600) y `storage/`
# (las fotos, bind-mount para que los backups del servidor las vean).
#
# La imagen NO se construye en el servidor: la construye deploy-to-srpy186.sh
# desde este repo y la carga por ssh (`docker save | docker load`). Así el
# servidor no necesita credenciales del repo de GitHub.
#
# Prerrequisitos (los hace el script la primera vez):
#   1. Service account de SÓLO LECTURA en carbid-staging — exactamente
#      roles/datastore.viewer + roles/storage.objectViewer +
#      roles/firebaseauth.viewer, nada más — y su clave en secrets/.
#      NUNCA la clave del Admin SDK: el espejo no tiene que poder escribir en
#      producción, ni por bug ni por compromiso del servidor.
#   2. Usuario y base en srpy-postgres:
#        create user renew_mirror password '<generado>';
#        create database renewsubastas_mirror owner renew_mirror;
#   3. `.env` con MIRROR_DATABASE_URL apuntando a esa base.
services:
  renew-mirror:
    image: renew-mirror:latest
    container_name: renew-mirror
    restart: unless-stopped
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/renew-mirror-sa.json
      MIRROR_PROJECT_ID: carbid-staging
      MIRROR_STORAGE_BUCKET: carbid-staging.firebasestorage.app
      MIRROR_STORAGE_DIR: /data/storage
      MIRROR_HEALTH_PORT: '8787'
      MIRROR_RECONCILE_HOURS: '6'
      MIRROR_AUTH_MINUTES: '30'
      MIRROR_STORAGE_MINUTES: '60'
    volumes:
      - ./secrets/renew-mirror-sa.json:/secrets/renew-mirror-sa.json:ro
      - ./storage:/data/storage
    ports:
      - '127.0.0.1:8787:8787'
    networks:
      - srpy-infra_default
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }

networks:
  # La red del stack de /home/santarosa/stack/infra, donde escucha
  # srpy-postgres:5432. Nombre real (compose lo prefija con el proyecto).
  srpy-infra_default:
    external: true
