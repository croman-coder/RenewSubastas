name: PR Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      # The Firebase emulators are a Java process. Pinned rather than relying
      # on whatever JDK the runner image ships by default.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter @carbid/shared-types build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (no emulators)
        run: |
          pnpm --filter @carbid/shared-types test
          pnpm --filter @carbid/web test
      # @carbid/functions tests talk to real Firestore/Auth through the
      # emulators. Only auth + firestore are started: no test exercises the
      # functions emulator (handlers are invoked directly) and the one test
      # touching Storage mocks adminStorage. No --import, so this runs against
      # a clean instance — verified 129/129 that way before landing this.
      # Project id must match GCLOUD_PROJECT in functions/src/test/setup.ts.
      - name: Test (functions, emulator-backed)
        run: |
          npx --yes firebase-tools@15 emulators:exec \
            --only auth,firestore \
            --project carbid-test \
            'pnpm --filter @carbid/functions test'
      - name: Web build
        run: pnpm --filter @carbid/web build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-fake
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '0'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:0:web:ci'
      - name: Functions build
        run: pnpm --filter @carbid/functions build
      - name: Format check
        run: pnpm format:check
