[build]
  base = "."
  # shared-types must compile to dist/ before web can resolve it via package.json main.
  command = "pnpm install --frozen-lockfile && pnpm --filter @carbid/shared-types build && pnpm --filter @carbid/web build"
  publish = "apps/web/.next"

  # Skip the build when nothing that reaches the browser changed.
  #
  # This is a monorepo: `functions/`, `firestore.rules`, `firestore.indexes.json`
  # and `docs/` all live beside the site but are deployed by the Firebase CLI, not
  # by Netlify. Without this, a commit touching only an index definition still ran
  # the full Next build and published a byte-identical site — real money for no
  # change. Production deploys were 76% of this account's credit burn.
  #
  # Semantics are inverted on purpose: exit 0 means "ignore this commit", exit 1
  # means "build it". `git diff --quiet` exits 0 when the listed paths are
  # unchanged, which is exactly the skip condition, so no negation is needed.
  #
  # The list is deliberately over-inclusive. A build that wasn't needed costs
  # credits; a build that was needed and got skipped ships a stale site, which is
  # far worse. When in doubt, add the path.
  #
  # If CACHED_COMMIT_REF is unset (first build after enabling this, or a cleared
  # cache) the command fails and Netlify builds — the safe direction.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps packages package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json turbo.json netlify.toml"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # HSTS: force HTTPS for 1 year, cover subdomains, opt into preload
    # list. 1y is the minimum hstspreload.org accepts. Don't add this
    # until the site has served everything over HTTPS — Renew already
    # does (Netlify + Vercel both force TLS).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # CSP: `unsafe-eval` removed — Next.js production bundles don't need
    # it (only dev tooling). `unsafe-inline` on scripts is still required
    # for Next's runtime bootstrap; we keep it but lock everything else
    # down to known Firebase / Sentry / reCAPTCHA origins.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://www.recaptcha.net https://*.firebaseapp.com https://browser.sentry-cdn.com https://*.ingest.sentry.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://us-central1-*.cloudfunctions.net https://content-firebaseappcheck.googleapis.com https://firebaseappcheck.googleapis.com https://fcm.googleapis.com https://fcmregistrations.googleapis.com https://*.sentry.io wss://*.firebaseio.com; frame-src 'self' https://www.google.com https://www.recaptcha.net https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none';"
