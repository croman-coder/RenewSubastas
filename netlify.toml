[build]
  base = "."
  # shared-types must compile to dist/ before web can resolve it via package.json main.
  command = "pnpm install --frozen-lockfile && pnpm --filter @carbid/shared-types build && pnpm --filter @carbid/web build"
  publish = "apps/web/.next"

  # NO agregar aquí una regla `ignore` sin resolver antes por qué falló la
  # anterior.
  #
  # El 12 de agosto se puso una para no gastar créditos: este es un monorepo y
  # un commit que sólo toca `functions/` o `docs/` no cambia nada de lo que ve
  # el navegador, pero igual disparaba un build completo. La idea era sana —los
  # deploys de producción eran el 76% del consumo de la cuenta— y la ejecución
  # salió cara.
  #
  # Qué pasó: Netlify cancela el build cuando el comando sale con código 0. La
  # regla comparaba `$CACHED_COMMIT_REF` con `$COMMIT_REF`, y con la variable
  # vacía el comando degeneraba en comparar el commit contra el árbol de
  # trabajo, que en un contenedor de build son lo mismo. Salía 0 y cancelaba. Y
  # un build cancelado no deja caché, así que el siguiente arrancaba igual de
  # vacío: se realimentaba solo.
  #
  # Resultado: tres commits sin publicar entre el 12 y el 14 de agosto, el
  # último el exportador de usuarios a Excel/PDF, y producción clavada en
  # 5e36fa0 durante dos días sin una sola alerta, porque un deploy salteado se
  # ve igual que uno sano desde afuera. Una versión con guardas explícitas para
  # la variable vacía también terminó cancelando, y el log del build no es
  # accesible por API para saber por qué.
  #
  # Con ese antecedente, el ahorro no paga el riesgo: un build de más cuesta
  # unos créditos, uno de menos deja producción vieja sin avisar. Si algún día
  # se reintenta, que sea contra una rama de prueba y comprobando en el log del
  # deploy qué vale `CACHED_COMMIT_REF`, no razonando sobre lo que debería
  # valer.

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # HSTS: force HTTPS for 1 year, cover subdomains, opt into preload
    # list. 1y is the minimum hstspreload.org accepts. Don't add this
    # until the site has served everything over HTTPS — Renew already
    # does (Netlify + Vercel both force TLS).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # CSP: `unsafe-eval` removed — Next.js production bundles don't need
    # it (only dev tooling). `unsafe-inline` on scripts is still required
    # for Next's runtime bootstrap; we keep it but lock everything else
    # down to known Firebase / Sentry / reCAPTCHA origins.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.google.com https://www.recaptcha.net https://*.firebaseapp.com https://browser.sentry-cdn.com https://*.ingest.sentry.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://us-central1-*.cloudfunctions.net https://content-firebaseappcheck.googleapis.com https://firebaseappcheck.googleapis.com https://fcm.googleapis.com https://fcmregistrations.googleapis.com https://*.sentry.io wss://*.firebaseio.com; frame-src 'self' https://www.google.com https://www.recaptcha.net https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none';"
